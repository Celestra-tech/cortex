[tool.uv.workspace]
members = ["apps/api", "packages/sdk-py", "services/*"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["apps/api/src", "packages/sdk-py", "services/*/src"]
extend-exclude = ["apps/web", "apps/www", "node_modules"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "ASYNC", # flake8-async
  "S",   # flake8-bandit
  "RUF", # ruff-specific
]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"**/migrations/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"
