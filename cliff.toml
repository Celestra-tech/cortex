# Release notes for CELESTRA Cortex, generated by git-cliff in .github/workflows/release.yml
# from Conventional Commits (feat:, fix:, perf:, ...). https://git-cliff.org

[changelog]
header = ""
body = """
{% if version %}\
## CELESTRA Cortex {{ version }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% if previous.version %}
Changes since {{ previous.version }}.
{% else %}
The first release of CELESTRA Cortex: memory, knowledge, multi-provider routing, \
observability, organization API keys, and production deployment on Cloud Run and Vercel.
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
{%- macro remote_url() -%}
{{ get_env(name="GITHUB_SERVER_URL", default="https://github.com") }}/{{ get_env(name="GITHUB_REPOSITORY", default="Celestra-tech/cortex") }}
{%- endmacro -%}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Non-conventional commits are kept (under "Other") so nothing silently disappears.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^sec", group = "<!-- 3 -->Security" },
  { body = ".*security", group = "<!-- 3 -->Security" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^(build|ci)", group = "<!-- 6 -->Build and CI" },
  { message = "^test", group = "<!-- 7 -->Tests" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps", group = "<!-- 8 -->Dependencies" },
  { message = "^(chore|style)", group = "<!-- 9 -->Other" },
  { message = ".*", group = "<!-- 9 -->Other" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
