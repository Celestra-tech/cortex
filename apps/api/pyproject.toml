[project]
name = "cortex-api"
version = "1.0.0a0"
description = "CELESTRA Cortex API — the HTTP gateway to the Cortex intelligence infrastructure."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.118",
  "uvicorn[standard]>=0.37",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "sqlalchemy[asyncio]>=2.0.43",
  "asyncpg>=0.30",
  "alembic>=1.16",
  "redis>=6.4",
  "httpx2>=2.13",
  "pgvector>=0.4",
  "pypdf>=6",
  "python-multipart>=0.0.20",
  "defusedxml>=0.7",
  "prometheus-client>=0.22",
  "opentelemetry-api>=1.37",
  "opentelemetry-sdk>=1.37",
  "opentelemetry-exporter-otlp-proto-http>=1.37",
  "opentelemetry-instrumentation-fastapi>=0.58b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.58b0",
  "opentelemetry-instrumentation-redis>=0.58b0",
]

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "ruff>=0.13",
  "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
  "database: requires PostgreSQL via CORTEX_TEST_DATABASE_URL (skipped when unset)",
  "redis: requires Redis via CORTEX_TEST_REDIS_URL (skipped when unset)",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["cortex_api"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
