# Non-secret settings for the production API. Secrets (database, Redis, admin token,
# provider keys) come from Secret Manager; see infra/scripts/lib.sh for their names.
# The API refuses to start with unsafe values here (wildcard or local CORS, auth off).
CORTEX_ENV: production
CORTEX_LOG_LEVEL: INFO
CORTEX_LOG_FORMAT: json
CORTEX_API_CORS_ORIGINS: https://cortex.celestra.ai
CORTEX_AUTH_REQUIRE_API_KEY: "true"
CORTEX_RATE_LIMIT_REQUESTS_PER_MINUTE: "600"
# Pool per instance: (pool + overflow) x max instances must stay under the Cloud SQL limit.
CORTEX_DATABASE_POOL_SIZE: "10"
CORTEX_DATABASE_MAX_OVERFLOW: "5"
CORTEX_KNOWLEDGE_EMBEDDING_PROVIDER: openai
CORTEX_METRICS_ENABLED: "true"
CORTEX_METRICS_PORT: "9464"
CORTEX_OTEL_ENABLED: "true"
CORTEX_OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
CORTEX_OTEL_SAMPLE_RATIO: "0.2"
