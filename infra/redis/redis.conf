# CELESTRA Cortex — Redis 8 configuration (local / single-node).

# Reachable from other containers on the compose network; the host port is bound to 127.0.0.1.
bind 0.0.0.0
protected-mode no
port 6379

# Persistence: AOF for durability, RDB snapshots for fast restarts.
appendonly yes
appendfsync everysec
save 900 1
save 300 10
dir /data

# Only keys with a TTL (cache entries) are evicted under memory pressure.
maxmemory 512mb
maxmemory-policy volatile-lru

tcp-keepalive 60
timeout 0
loglevel notice
