# Local Prometheus (infra/monitoring/docker-compose.monitoring.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cortex-api
    static_configs:
      - targets: ["api:9464"]
        labels:
          environment: development
